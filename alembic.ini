# Alembic configuration file

[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is expected to be passed to datetime.timezone
# for non-zoned (non-utc) times - for example "US/Eastern"
# prepend a "+" for offsets from UTC: e.g. "+05:30"
# timezone = UTC

# the character set to encode the files with
# file_encoding = utf-8

# the version location to use when generating new migrations
version_locations = %(here)s/alembic/versions

# the default value set for sqlalchemy.url
# this is the value that will be used if no url is passed
# on the command line
sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/agent

# version table name
version_table = alembic_version

# the naming style used for the generated migration files
# %d - insert the migration date YYYY-MM-DD
# %% - the word "revision"
# %(rev)s - the revision id
# %(slug)s - the slugified version of the message
# %(year)s, %(month)s, %(day)s, %(hour)s, %(minute)s, %(second)s, %(microsecond)s - date components
# file_template = %%(rev)s_%%(slug)s

# the version number to start at when generating new migrations
# start_rev = 1

# separator to use between revision ids in multiple-head mode
# version_path_separator = @

# the version number to start at when generating new branches
# branch_rev = phi

# the maximum length of the branch version string
# max_version_length = 255

# versioning scheme: datetime, sequential, or date
# versioning_scheme = datetime

# whether to allow multiple heads
# multiple_heads = False

# whether to allow empty migrations
# allow_empty = False

# sqlalchemy.warn_20 = true

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated migration scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S