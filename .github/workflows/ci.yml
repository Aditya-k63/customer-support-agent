name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234509876
          POSTGRES_DB: CRAG
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: ruff check app tests scripts

      - name: Run unit tests
        env:
          DB_NAME: CRAG
          DB_USER: postgres
          DB_PASSWORD: 1234509876
          DB_HOST: localhost
          DB_PORT: 5432
          GROQ_API_KEY: test_key
          GROQ_MODEL: openai/gpt-oss-20b
          API_KEY: rag-secret-2026
        run: pytest tests/ -v

      - name: Run regression evaluation gate
        env:
          DB_NAME: CRAG
          DB_USER: postgres
          DB_PASSWORD: 1234509876
          DB_HOST: localhost
          DB_PORT: 5432
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          API_KEY: rag-secret-2026
        run: python scripts/run_evaluation.py