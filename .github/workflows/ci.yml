name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_real_eval:
        description: "Run the real-model evaluation (requires LLM secrets)"
        type: boolean
        default: true
      update_baseline:
        description: "Publish the real-eval report as the new baseline branch"
        type: boolean
        default: false

jobs:
  # Deterministic gate 1: lint + unit tests (no external services)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: ruff check app tests scripts ingestion

      - name: Run unit tests
        env:
          RUN_MIGRATIONS_ON_STARTUP: "false"
          ENVIRONMENT: test
          API_KEY: test-api-key
          ADMIN_API_KEY: test-admin-key
          GROQ_API_KEY: test_key
        run: pytest tests/ -v

  # Deterministic gate 2: mocked LLM + deterministic retrieval
  benchmark:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic regression gate
        run: python scripts/run_deterministic_eval.py

      - name: Upload deterministic regression report
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-regression-report
          path: regression_report.json
          if-no-files-found: error

  # Real-model evaluation: manual only, requires secrets and a model download
  real-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-password' }}
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies (CPU PyTorch + embeddings)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install -r requirements-embeddings.txt

      - name: Create database and apply migrations
        env:
          DB_NAME: agent
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-password' }}
          DB_HOST: localhost
          DB_PORT: 5432
        run: python scripts/create_db.py

      - name: Ingest knowledge base
        env:
          DB_NAME: agent
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-password' }}
          DB_HOST: localhost
          DB_PORT: 5432
        run: python ingestion/ingest_docs.py

      - name: Run real-model evaluation gate
        env:
          DB_NAME: agent
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-password' }}
          DB_HOST: localhost
          DB_PORT: 5432
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: meta-llama/llama-3.1-8b-instruct
          API_KEY: ${{ secrets.API_KEY || 'ci-eval-api-key' }}
        run: python scripts/run_real_eval.py

      - name: Upload real regression report
        uses: actions/upload-artifact@v4
        with:
          name: real-regression-report
          path: regression_report_real.json
          if-no-files-found: error

  # Docker build always validates the image; push happens only when Docker Hub
  # credentials are configured.
  docker:
    needs: benchmark
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        id: docker_credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.docker_credentials.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ steps.docker_credentials.outputs.enabled == 'true' }}
          load: ${{ steps.docker_credentials.outputs.enabled != 'true' }}
          tags: adsharma14/customer-support-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container vulnerability scan
        if: steps.docker_credentials.outputs.enabled == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: adsharma14/customer-support-agent:latest
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

  # Baseline updates are manual and land on a branch, never directly on main.
  update-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
    needs: real-eval
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download real regression report
        uses: actions/download-artifact@v4
        with:
          name: real-regression-report
          path: .

      - name: Commit baseline to a branch
        run: |
          cp regression_report_real.json baseline_report.json
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b ci/baseline-update
          git add baseline_report.json
          git commit -m "chore: update real evaluation baseline"
          git push --force origin HEAD:ci/baseline-update
